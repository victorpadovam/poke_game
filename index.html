<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O peixe e a pokébola</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f6f2; --pencil:#4a4a4a; --blue:#1f6fd0; --lime:#d6f23a;
    --c1:#e0457b; --c2:#f28c1e; --c3:#f2d21e; --c4:#1f9a9a; --c5:#7a3b6e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#d9d7d0; color:var(--pencil);
    font-family:'Patrick Hand','Comic Sans MS',cursive; font-size:20px;
    display:flex; justify-content:center; touch-action:manipulation;
  }
  .paper{
    position:relative; width:100%; max-width:460px; height:100%;
    background:var(--paper); overflow:hidden;
    box-shadow:0 0 30px rgba(0,0,0,.18);
  }
  .screen{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:28px; text-align:center}
  .hidden{display:none !important}

  /* tela de upload */
  h1{font-weight:400; font-size:34px; margin:0; line-height:1.1}
  p{margin:0; line-height:1.3}
  .drop{
    border:3px dashed var(--pencil); border-radius:14px; padding:26px 20px;
    width:100%; cursor:pointer; background:#fff;
  }
  .drop:focus-within,.drop:hover{border-color:var(--blue)}
  .drop input{position:absolute; opacity:0; width:1px; height:1px}
  .fname{font-size:18px; color:var(--blue); min-height:24px}
  button{
    font:inherit; font-size:24px; color:#fff; background:var(--blue);
    border:0; border-radius:14px; padding:14px 28px; cursor:pointer;
  }
  button:disabled{background:#b9b9b9; cursor:not-allowed}
  button:focus-visible,.drop:focus-within{outline:3px solid var(--c2); outline-offset:3px}
  button:active:not(:disabled){transform:translateY(2px)}

  /* tela do jogo */
  #game{display:block}
  .guide{position:absolute; left:50%; top:0; bottom:0; width:10px; transform:translateX(-50%);
    background:repeating-linear-gradient(to bottom,
      var(--c1) 0 12px, transparent 12px 22px,
      var(--c2) 22px 34px, transparent 34px 44px,
      var(--c3) 44px 56px, transparent 56px 66px,
      var(--c4) 66px 78px, transparent 78px 88px,
      var(--c5) 88px 100px, transparent 100px 110px);
    opacity:.85}
  #ball{
    position:absolute; left:50%; top:120px; width:84px; height:84px;
    margin:-42px 0 0 -42px; transition:transform .35s ease, opacity .35s ease;
  }
  #ball.eaten{transform:scale(.1); opacity:0}
  #fish{
    position:absolute; left:50%; width:130px; height:70px;
    margin:-35px 0 0 -65px; transform:rotate(90deg);
    transition:top .28s cubic-bezier(.3,1.4,.5,1);
  }
  #fish.reset{transition:none}
  #fish svg{width:100%; height:100%; display:block; overflow:visible}
  #fish.chomp svg{animation:chomp .3s ease}
  @keyframes chomp{50%{transform:scale(1.25)}}

  .hud{position:absolute; top:14px; left:0; right:0; display:flex; justify-content:space-between;
    padding:0 18px; pointer-events:none}
  .hud span{background:rgba(255,255,255,.85); padding:2px 12px; border-radius:10px}
  .controls{position:absolute; bottom:22px; left:0; right:0; display:flex; flex-direction:column;
    align-items:center; gap:8px}
  .controls small{font-size:16px; opacity:.7}
  #swim{font-size:28px; padding:16px 34px}
  .change{background:none; color:var(--pencil); text-decoration:underline; font-size:16px; padding:4px 8px}
  @media (prefers-reduced-motion:reduce){ #fish,#ball{transition:none} #fish.chomp svg{animation:none} }

  /* obstáculos, cocô e aviso de fase */
  .obs{position:absolute; left:0; top:0; width:60px; height:60px; margin:-30px 0 0 -30px; pointer-events:none}
  .obs svg{width:100%; height:100%; display:block; overflow:visible}
  .poop{position:absolute; left:50%; font-size:38px; line-height:1; margin:-19px 0 0 -19px;
    pointer-events:none; animation:plop 1.5s ease-out forwards}
  @keyframes plop{
    0%{transform:scale(.2); opacity:0}
    18%{transform:scale(1.15); opacity:1}
    100%{transform:translateY(120px) rotate(28deg) scale(1); opacity:0}
  }
  #fish.hit svg{animation:shake .45s ease}
  @keyframes shake{20%{transform:translateY(-9px)}40%{transform:translateY(9px)}60%{transform:translateY(-6px)}80%{transform:translateY(6px)}}
  .banner{position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.9); width:84%;
    background:#fff; border:3px dashed var(--pencil); border-radius:16px; padding:14px 16px;
    text-align:center; opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease; z-index:5}
  .banner.show{opacity:1; transform:translate(-50%,-50%) scale(1)}
  .banner b{display:block; font-weight:400; font-size:38px; line-height:1.1}
  .banner span{font-size:20px}
  @media (prefers-reduced-motion:reduce){ .poop{animation-duration:.01s} #fish.hit svg{animation:none} }

  .bit{position:absolute; left:0; top:0; pointer-events:none; z-index:6}
  .hud{flex-wrap:wrap; gap:6px; font-size:18px}

  [hidden]{display:none !important}
  #fish{transition:top .28s cubic-bezier(.3,1.4,.5,1), left .2s ease}
  #fish.safe svg{animation:blink .25s linear infinite}
  @keyframes blink{50%{opacity:.3}}
  .row{display:flex; gap:10px; align-items:center; justify-content:center}
  .side{font-size:28px; padding:14px 20px}
  .wallbar{position:absolute; height:12px; background:#9a9384; border:3px solid #444; border-radius:6px; box-sizing:border-box; pointer-events:none}
  .ninja{position:absolute; left:0; top:0; width:120px; height:140px; overflow:visible; pointer-events:none; z-index:7}
  .slash{position:absolute; left:0; top:0; width:240px; height:7px; border-radius:4px; pointer-events:none; z-index:7;
    background:linear-gradient(90deg,transparent,#fff 30%,#cfd8dc 70%,transparent);
    box-shadow:0 0 12px 3px rgba(255,255,255,.9),0 0 3px #888}
</style>
</head>
<body>
<main class="paper">

  <!-- 2. Jogo -->
  <section class="screen" id="game" aria-live="polite">
    <div class="guide" aria-hidden="true"></div>

    <div id="ball" aria-label="Pokébola">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="#fff" stroke="#222" stroke-width="3"/>
        <path d="M4 50a46 46 0 0 1 92 0z" fill="#d8223a" stroke="#222" stroke-width="3"/>
        <rect x="4" y="46" width="92" height="9" fill="#222"/>
        <circle cx="50" cy="50" r="14" fill="#fff" stroke="#222" stroke-width="4"/>
        <circle cx="50" cy="50" r="7" fill="#e6e6e6" stroke="#999" stroke-width="1.5"/>
      </svg>
    </div>

    <div id="fish" aria-label="Peixe">
      <svg viewBox="0 0 200 100"><use href="#fishShape"/></svg>
    </div>

    <div class="hud">
      <span>Fase <b id="phase">1</b></span>
      <span>Bolinhas comidas: <b id="score">0</b></span>
      <span>Mortes: <b id="deaths">0</b></span>
    </div>

    <div class="banner" id="banner" aria-live="assertive"><b id="bannerTitle"></b><span id="bannerText"></span></div>

    <div class="controls">
      <div class="row">
        <button class="side" id="left" hidden aria-label="Nadar pra esquerda">←</button>
        <button id="swim">Nadar pra cima</button>
        <button class="side" id="right" hidden aria-label="Nadar pra direita">→</button>
      </div>
      <small>ou aperte a seta ↑ / espaço</small>
    </div>
  </section>
</main>

<!-- desenho do peixe, no estilo do lápis -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="fishShape">

      <!-- nadadeiha de cima e de baixo -->
      <path d="M70 32 C80 8 108 6 118 22 L110 34Z" fill="#bdbdbd" stroke="#444" stroke-width="3"/>
      <path d="M85 68 C92 90 112 94 124 80 L112 66Z" fill="#a8a8a8" stroke="#444" stroke-width="3"/>
      <!-- corpo -->
      <path d="M10 52 C14 34 40 28 80 28 C115 28 135 38 146 50 C135 64 115 72 80 72 C40 72 14 68 10 52Z" fill="#dedede" stroke="#444" stroke-width="3"/>
      <!-- listras -->
      <path d="M62 30 C70 44 66 58 60 71 M88 30 C96 44 92 58 86 71 M114 33 C120 44 118 58 112 68" stroke="#555" stroke-width="9" stroke-linecap="round" fill="none" opacity=".75"/>
      <!-- guelra, olho, boca -->
      <path d="M44 36 C50 46 50 58 44 68" stroke="#444" stroke-width="2.5" fill="none"/>
      <circle cx="30" cy="45" r="7" fill="#fff" stroke="#333" stroke-width="2.5"/>
      <circle cx="30" cy="45" r="2.5" fill="#222"/>
      <path d="M12 56 q6 6 12 0 q4 4 8 0" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

      { transform: 'translate(0,0) rotate(90deg)', opacity: 1 },
      { transform: `translate(${dx}px,${dy - 50}px) rotate(${90 + spin * 0.5}deg)`, opacity: 1, offset: 0.35 },
      { transform: `translate(${dx * 1.4}px,${dy + 220}px) rotate(${90 + spin}deg)`, opacity: 0 }
    ], { duration: 1100, easing: 'ease-in', fill: 'forwards' }).onfinish = () => c.remove();
  }

  function die(fx, fy) {
    if (dead) return;
    dead = true;
    deathsEl.textContent = ++deaths;
    const W = stage.clientWidth;
    fish.classList.remove('chomp', 'safe');
    fish.style.transition = 'none';

    // 1) o ninja chega correndo pela direita
    const ninja = document.createElement('div');
    ninja.className = 'ninja';
    ninja.innerHTML = NINJA_SVG;
    stage.appendChild(ninja);
    const ny = fy - 70;
    ninja.animate([
      { transform: `translate(${W + 60}px,${ny}px)` },
      { transform: `translate(${fx + 70}px,${ny}px)` }
    ], { duration: 260, easing: 'ease-out', fill: 'forwards' });

    // 2) golpe de espada: o peixe vira duas metades e sangue pra todo lado
    setTimeout(() => {
      const slash = document.createElement('div');
      slash.className = 'slash';
      stage.appendChild(slash);
      slash.animate([
        { transform: `translate(${fx - 120}px,${fy - 3}px) rotate(-28deg) scaleX(.2)`, opacity: 0 },
        { transform: `translate(${fx - 120}px,${fy - 3}px) rotate(-28deg) scaleX(1)`, opacity: 1, offset: 0.4 },
        { transform: `translate(${fx - 120}px,${fy - 3}px) rotate(-28deg) scaleX(1)`, opacity: 0 }
      ], { duration: 350, fill: 'forwards' }).onfinish = () => slash.remove();
      half('inset(0 50% 0 0)', -70, -60, -160);      // metade da cabeça
      half('inset(0 0 0 50%)', 70, 10, 200);         // metade da cauda
      fish.style.opacity = 0;
      burst(fx, fy);
      setTimeout(() => burst(fx, fy), 120);
    }, 280);

    // 3) o ninja vai embora
    setTimeout(() => ninja.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }).onfinish = () => ninja.remove(), 1300);

    // 4) o peixe renasce
    setTimeout(() => {
      fish.style.cssText = '';
      dead = false;
      resetRound();
    }, 1950);
  }

  function tick(now) {
    const t = (now - t0) / 1000;
    const cx = stage.clientWidth / 2;
    const amp = Math.min(cx - 30, 200);
    for (const o of obstacles) {
      o.x = cx + Math.sin(t * o.speed + o.offset) * amp * o.dir;
      o.y = yAtStep(o.lane + 0.5);
      o.el.style.transform = `translate(${o.x}px, ${o.y}px)`;
    }
    if (!dead && !eating && now > safeUntil && obstacles.length) {
      const r = fish.getBoundingClientRect(), s = stage.getBoundingClientRect();
      const fx = r.left + r.width / 2 - s.left, fy = r.top + r.height / 2 - s.top;
      for (const o of obstacles) {
        if (Math.abs(o.x - fx) < 38 && Math.abs(o.y - fy) < 50) { die(fx, fy); break; }
      }
    }
    requestAnimationFrame(tick);
  }

  // --- jogo ---
  let step = 0, eating = false, count = 0;

  function place() { fish.style.top = yAtStep(step) + 'px'; }

  function resetRound() {
    const newPhase = 1 + Math.floor(count / PER_PHASE);
    fish.classList.add('reset');
    step = 0; place(); setCol(CENTER);
    void fish.offsetWidth;
    fish.classList.remove('reset');
    ball.classList.remove('eaten');
    eating = false;
    // alguns instantes de proteção ao nascer, pra não morrer direto
    safeUntil = performance.now() + 1800;
    fish.classList.add('safe');
    setTimeout(() => fish.classList.remove('safe'), 1800);
    if (newPhase !== phase) {
      phase = newPhase;
      phaseEl.textContent = phase;
      buildObstacles();
      leftBtn.hidden = rightBtn.hidden = !mazeOn();
      showBanner();
    }
    if (mazeOn()) newMaze(); else drawWalls();
  }

  function showBanner() {
    $('bannerTitle').textContent = 'Fase ' + phase;
    let text;
    if (phase === MAZE_PHASE) text = 'Labirinto! Use ← → para achar a abertura em cada parede.';
    else if (phase > MAZE_PHASE) text = 'O labirinto muda a cada bolinha.';
    else if (phase >= TYPES.length) text = 'Tudo ficou um pouco mais rápido!';
    else text = 'Novo obstáculo: ' + TYPES[phase - 1].text;
    $('bannerText').textContent = text;
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 3200);
  }

  function bump() {
    fish.classList.remove('hit'); void fish.offsetWidth; fish.classList.add('hit');
  }

  function swimUp() {
    if (eating || dead) return;
    unlockAudio();
    if (mazeOn()) {
      const gap = step < STEPS - 1 ? gaps[step] : CENTER;   // última subida: só pelo meio, onde está a bolinha
      if (col !== gap) { bump(); return; }
    }
    step++; place();
    if (step >= STEPS) eat();
  }

  function side(dir) {
    if (eating || dead || !mazeOn()) return;
    unlockAudio();
    setCol(Math.max(0, Math.min(COLS - 1, col + dir)));
  }

  function poop() {
    const p = document.createElement('div');
    p.className = 'poop';
    p.textContent = '💩';
    p.style.top = (yAtStep(STEPS) + 82) + 'px';
    stage.insertBefore(p, fish);
    setTimeout(() => p.remove(), 1600);
  }

  function eat() {
    eating = true;
    playSound();
    setTimeout(() => {
      ball.classList.add('eaten');
      fish.classList.remove('chomp'); void fish.offsetWidth; fish.classList.add('chomp');
      score.textContent = ++count;
    }, 280);
    setTimeout(poop, 950);
    setTimeout(resetRound, 2400);
  }

  swim.addEventListener('click', swimUp);
  leftBtn.addEventListener('click', () => side(-1));
  rightBtn.addEventListener('click', () => side(1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.code === 'Space') { e.preventDefault(); swimUp(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); side(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); side(1); }
  });
  window.addEventListener('resize', () => { if (!dead) { place(); setCol(col); drawWalls(); } });
  resetRound();
  buildObstacles();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
